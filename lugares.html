<body data-page="lugares">
  <main class="container">
    <header class="site-header"><h1 class="site-title">roledfora</h1><p class="site-subtitle">o que tem pra fazer por aí?</p></header>

    <section class="page-intro"><h2>lugares pra conhecer</h2><p>cultura, natureza, comida, noite, cinema, teatro, feiras e experiências pelo df e entorno.</p></section>

    <section class="search-panel" aria-label="filtrar lugares">
      <p class="search-title">encontre um lugar no df e entorno</p>
      <div class="search-row lugares-search simple-search">
        <div class="field local">
          <label for="onde">onde?</label>
          <select id="onde"><option value="qualquer">qualquer lugar</option></select>
        </div>
        <div class="field tipo">
          <label for="categoria">o que fazer?</label>
          <select id="categoria">
            <option value="qualquer">qualquer tipo</option>
            <option value="arquitetura-turismo">arquitetura & pontos turísticos</option>
            <option value="bares-noite">bares & noite</option>
            <option value="cinema-teatro">cinema & teatro</option>
            <option value="comer">comer</option>
            <option value="cultura-historia">cultura & história</option>
            <option value="feiras-compras">feiras & compras</option>
            <option value="lazer-experiencias">lazer & experiências</option>
            <option value="natureza">natureza</option>
          </select>
        </div>
      </div>
    </section>

    <section class="search-results-section" hidden>
      <div class="results-head"><h2 class="section-title">pra conhecer</h2><span id="result-count" class="result-count">0 resultados</span></div>
      <div id="results" class="cards-grid"></div>
      <div class="more-wrap"><button id="show-more" class="show-more" hidden>mostrar mais</button></div>
    </section>
