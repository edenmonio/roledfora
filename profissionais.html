<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>roledfora — profissionais</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./browse.css" />
  <script src="./locations.js" defer></script>
  <script src="./site-polish.js" defer></script>
  <script src="./profissionais.js" defer></script>
</head>
<body data-page="profissionais">
  <main class="container">
    <header class="site-header">
      <h1 class="site-title">roledfora</h1>
      <p class="site-subtitle">o que tem pra fazer por aí?</p>
    </header>

    <nav class="main-nav" aria-label="páginas principais">
      <a href="./index.html">eventos</a>
      <a href="./lugares.html">lugares</a>
      <a class="active" href="./profissionais.html">profissionais</a>
    </nav>
    <nav class="utility-nav" aria-label="ferramentas">
      <a href="./novidades.html">✨ novidades</a>
      <a href="./salvos.html">⭐ salvos</a>
      <a href="./roteiros.html">🧭 roteiros</a>
      <a href="./contato.html">💌 contato</a>
    </nav>

    <section class="page-intro">
      <h2>profissionais pra contratar</h2>
      <p>gente do df e entorno pra acompanhar, chamar pro seu projeto e guardar.</p>
    </section>

    <section class="search-panel" aria-label="filtrar profissionais">
      <p class="search-title">encontre um profissional no df e entorno</p>
      <div class="search-row profissionais-search simple-search">
        <div class="field local">
          <label for="prof-local">onde?</label>
          <select id="prof-local"><option value="qualquer">qualquer lugar</option></select>
        </div>
        <div class="field tipo">
          <label for="prof-tipo">área profissional?</label>
          <select id="prof-tipo">
            <option value="qualquer">qualquer área</option>
          </select>
        </div>
        <div class="field servico">
          <label for="prof-servico">serviço?</label>
          <select id="prof-servico" disabled>
            <option value="qualquer">escolha uma área primeiro</option>
          </select>
        </div>
      </div>
    </section>

    <section class="search-results-section" hidden>
      <div class="results-head">
        <h2 class="section-title">profissionais encontrados</h2>
        <span id="result-count" class="result-count">0 resultados</span>
      </div>
      <div id="results" class="cards-grid"></div>
    </section>
  </main>
</body>
</html>
